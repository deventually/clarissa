# Bouwt bij elke push naar main beide proefversies uit dezelfde code en zet ze samen op GitHub Pages:
#   https://deventually.github.io/clarissa/     keuzepagina (.github/pages/index.html)
#   https://deventually.github.io/clarissa/v1/  VERSIE=1
#   https://deventually.github.io/clarissa/v2/  VERSIE=2
# Wat de versies van elkaar onderscheidt, staat in src/versie.ts. Beide hebben noindex (zie Base.astro).
# Overstappen naar het eigen domein: de gekozen versie bouwen zonder SITE en BASE_PATH, een
# CNAME-bestand met clarissa-bodyandstyle.nl in /public zetten en de DNS naar GitHub Pages laten wijzen.
name: Deploy naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE: https://deventually.github.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Versie 1 bouwen
        run: npm run build -- --outDir site/v1
        env:
          VERSIE: '1'
          BASE_PATH: /clarissa/v1
      - name: Versie 2 bouwen
        run: npm run build -- --outDir site/v2
        env:
          VERSIE: '2'
          BASE_PATH: /clarissa/v2
      - name: Keuzepagina en doorverwijzing in de root
        run: cp .github/pages/index.html .github/pages/404.html site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
