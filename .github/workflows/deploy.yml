# Bouwt de site bij elke push naar main en zet hem op GitHub Pages.
# Proefversie: https://deventually.github.io/clarissa (met noindex, zie Base.astro).
# Overstappen naar het eigen domein: SITE en BASE_PATH hieronder weghalen, een CNAME-bestand met
# clarissa-bodyandstyle.nl in /public zetten en de DNS bij de domeinprovider naar GitHub Pages laten wijzen.
name: Deploy naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE: https://deventually.github.io
      BASE_PATH: /clarissa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
