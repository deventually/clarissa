<!doctype html>
<!-- Keuzepagina op deventually.github.io/clarissa: de twee proefversies naast elkaar.
     De deploy-workflow zet dit bestand in de root, naast de mappen v1 en v2. -->
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="only light" />
    <title>Clarissa Body &amp; Style · proefversies</title>
    <style>
      :root {
        color-scheme: only light;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        box-sizing: border-box;
        font-family: 'Futura', 'Century Gothic', system-ui, sans-serif;
        color: #fbeef4;
        background: linear-gradient(165deg, #3d1238 0%, #1a0817 55%, #12050f 100%);
      }
      main {
        width: 100%;
        max-width: 26rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-family: 'Bodoni 72', Didot, serif;
        font-size: 2.25rem;
        line-height: 1.1;
      }
      p {
        margin: 0 0 1.75rem;
        color: #d9bfd0;
        line-height: 1.5;
      }
      ul {
        display: grid;
        gap: 0.75rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      a {
        display: block;
        padding: 1rem 1.25rem;
        border-radius: 1.25rem;
        color: #fbeef4;
        text-decoration: none;
        background: rgb(255 255 255 / 0.08);
        box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.14);
      }
      a:hover,
      a:focus-visible {
        background: rgb(255 255 255 / 0.14);
      }
      a:focus-visible {
        outline: 3px solid #f6a9cb;
        outline-offset: 3px;
      }
      strong {
        display: block;
        font-size: 1.125rem;
      }
      span {
        color: #d9bfd0;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Clarissa Body &amp; Style</h1>
      <p>Twee proefversies van de nieuwe website.</p>
      <ul>
        <li>
          <a href="v1/"><strong>Versie 1</strong><span>Zwevend menu op mobiel</span></a>
        </li>
        <li>
          <a href="v2/"><strong>Versie 2</strong><span>Vast menu onderaan op mobiel</span></a>
        </li>
      </ul>
    </main>
  </body>
</html>
